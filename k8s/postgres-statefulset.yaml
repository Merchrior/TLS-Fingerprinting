# Postgres'e iki Service ile erişim:
#   1) ClusterIP (tls-postgres): K8s içindeki diğer pod'lar için
#   2) NodePort (tls-postgres-external): Host'taki host_agent.py için
---
apiVersion: v1
kind: Service
metadata:
  name: tls-postgres
  namespace: tls-fingerprinting
spec:
  clusterIP: None   # Headless service — StatefulSet için
  selector:
    app: tls-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: tls-postgres-external
  namespace: tls-fingerprinting
spec:
  type: NodePort
  selector:
    app: tls-postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30543   # Host'tan erişim: localhost:30543
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tls-postgres
  namespace: tls-fingerprinting
spec:
  serviceName: tls-postgres
  replicas: 1
  selector:
    matchLabels:
      app: tls-postgres
  template:
    metadata:
      labels:
        app: tls-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tls-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tls-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tls-config
                  key: DB_NAME
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
