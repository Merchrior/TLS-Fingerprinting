apiVersion: v1
kind: Secret
metadata:
  name: tls-secrets
  namespace: tls-fingerprinting
type: Opaque
stringData:
  # stringData → K8s base64'e otomatik çevirir
  # UYARI: Bu dosyayı git'e commit etme. .gitignore'a ekle.
  DB_USER: "user"
  DB_PASSWORD: "pass"
  DB_URL: "postgresql://user:pass@tls-postgres:5432/tls_db"
  VIRUSTOTAL_API_KEY: "REPLACE_ME"
  ABUSECH_API_KEY: "REPLACE_ME"
